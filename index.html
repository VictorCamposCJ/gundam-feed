<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novedades Gunpla España</title>
<link rel="alternate" type="application/rss+xml" href="data/feed.xml" title="Novedades Gunpla">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f2ee;--panel:#fff;--ink:#23262b;--mute:#666b73;--line:#d9d9d2;--blue:#1d4f9f;--red:#c8202f;--yellow:#f0b90b}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--panel:#1f2227;--ink:#ecebe6;--mute:#9aa0a8;--line:#33373e;--blue:#6b9bea;--red:#ef5a66;--yellow:#f0b90b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif}
header{border-bottom:6px solid var(--blue);box-shadow:0 6px 0 var(--red);background:var(--panel);margin-bottom:12px}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
h1{font:700 clamp(2rem,6vw,3.4rem)/1 "Barlow Condensed",sans-serif;margin:0;padding:22px 0 6px;letter-spacing:.01em}
header p{margin:0 0 18px;color:var(--mute)}
header a{color:var(--blue)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
input[type=search]{flex:1 1 220px}
.chip{font:600 .95rem "Barlow Condensed",sans-serif;padding:5px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
label.chk{display:flex;gap:6px;align-items:center;color:var(--mute)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
#meta{color:var(--mute);margin:14px 0 8px;font-size:.95rem}
#warn{background:var(--yellow);color:#23262b;padding:8px 12px;border-radius:4px;margin:12px 0;display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;padding-bottom:50px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;text-decoration:none;color:inherit;overflow:hidden}
.card:hover{border-color:var(--blue)}
.card .im{aspect-ratio:1;background:#fff;display:grid;place-items:center;position:relative}
.card img{max-width:100%;max-height:100%;object-fit:contain}
.card .tag{position:absolute;left:0;top:0;background:var(--red);color:#fff;font:700 .85rem "Barlow Condensed",sans-serif;padding:2px 8px}
.card .gr{position:absolute;right:0;top:0;background:var(--ink);color:var(--bg);font:700 .85rem "Barlow Condensed",sans-serif;padding:2px 8px}
.card .tx{padding:10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h3{font:600 1rem/1.25 Barlow,sans-serif;margin:0;flex:1}
.card .pr{font:700 1.3rem "Barlow Condensed",sans-serif}
.card .st{color:var(--mute);font-size:.88rem}
.out{opacity:.55}.out .st b{color:var(--red)}.in .st b{color:#1d8a4a}
.empty{padding:40px 0;color:var(--mute)}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Novedades Gunpla España</h1>
  <p>Productos de tiendas españolas, ordenados por lo último que ha aparecido. <a href="data/feed.xml">Feed RSS</a></p>
</div></header>
<div class="bar"><div class="wrap row">
  <input type="search" id="q" placeholder="Buscar: RG Nu, Sazabi, Aerial…" aria-label="Buscar">
  <select id="store" aria-label="Tienda"><option value="">Todas las tiendas</option></select>
  <select id="sort" aria-label="Ordenar">
    <option value="new">Más recientes</option><option value="pa">Precio: menor a mayor</option><option value="pd">Precio: mayor a menor</option>
  </select>
  <label class="chk"><input type="checkbox" id="stock"> Solo con stock</label>
  <label class="chk"><input type="checkbox" id="noacc" checked> Ocultar accesorios</label>
  <div class="row" id="grades" role="group" aria-label="Gama"></div>
</div></div>
<div class="wrap">
  <div id="warn"></div>
  <div id="meta"></div>
  <div class="grid" id="grid"></div>
</div>
<script>
const $ = id => document.getElementById(id);
let all = [], gradeSel = new Set();
const eur = n => n ? n.toLocaleString('es-ES',{style:'currency',currency:'EUR'}) : 'Consultar';
const DAYS7 = 7*864e5;

fetch('data/productos.json?'+Date.now()).then(r=>r.json()).then(d=>{
  all = d.products;
  const upd = d.updated ? new Date(d.updated).toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'short'}) : 'sin datos todavía';
  $('meta').dataset.upd = upd;
  if (d.errors && d.errors.length){ $('warn').style.display='block'; $('warn').textContent='No se han podido actualizar: '+d.errors.join(', ')+'. Se muestran los últimos datos conocidos.'; }
  [...new Set(all.map(p=>p.store))].sort().forEach(s=>$('store').add(new Option(s,s)));
  ['PG','MG','RG','HG','SD','EG','Figura','Accesorio','Otro'].filter(g=>all.some(p=>p.grade===g)).forEach(g=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent=g; b.setAttribute('aria-pressed','false');
    b.onclick=()=>{gradeSel.has(g)?gradeSel.delete(g):gradeSel.add(g); b.setAttribute('aria-pressed',gradeSel.has(g)); render();};
    $('grades').append(b);
  });
  render();
}).catch(()=>{ $('grid').innerHTML='<p class="empty">No se pudo cargar data/productos.json. Ejecuta el scraper primero.</p>'; });

['q','store','sort','stock','noacc'].forEach(id=>$(id).addEventListener('input',render));

function render(){
  const q=$('q').value.trim().toLowerCase(), st=$('store').value, onlyStock=$('stock').checked, noAcc=$('noacc').checked;
  let list=all.filter(p=>(!q||p.title.toLowerCase().includes(q))&&(!st||p.store===st)&&(!onlyStock||p.in_stock)&&(!gradeSel.size||gradeSel.has(p.grade))&&(!noAcc||gradeSel.has('Accesorio')||p.grade!=='Accesorio'));
  const s=$('sort').value;
  if(s==='pa') list.sort((a,b)=>a.price-b.price); else if(s==='pd') list.sort((a,b)=>b.price-a.price);
  $('meta').textContent=`${list.length} productos · actualizado ${$('meta').dataset.upd}`;
  const now=Date.now(), esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  $('grid').innerHTML=list.length?list.slice(0,300).map(p=>`
    <a class="card ${p.in_stock?'in':'out'}" href="${esc(p.url)}" target="_blank" rel="noopener">
      <div class="im">${p.image?`<img loading="lazy" src="${esc(p.image)}" alt="">`:''}
        ${now-new Date(p.first_seen)<DAYS7?'<span class="tag">Nuevo</span>':''}<span class="gr">${p.grade}</span></div>
      <div class="tx"><h3>${esc(p.title)}</h3><div class="pr">${eur(p.price)}</div>
      <div class="st">${esc(p.store)} · <b>${p.in_stock?'En stock':'Agotado'}</b></div></div></a>`).join('')
    :'<p class="empty">Ningún producto coincide con estos filtros.</p>';
}
</script>
</body>
</html>
