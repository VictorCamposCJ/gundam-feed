name: Actualizar productos
on:
  schedule: [{cron: "*/30 * * * *"}]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scrape
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4
      - run: python scraper.py
        timeout-minutes: 20
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH: ${{ vars.WATCH }}
      - name: Guardar datos
        run: |
          git config user.name "gundam-bot"; git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "datos $(date -u +%F\ %H:%M)" && git pull --rebase -q && git push)
