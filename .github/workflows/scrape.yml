name: Actualizar productos
on:
  schedule: [{cron: "0 */3 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4
      - run: python scraper.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH: ${{ vars.WATCH }}
      - name: Guardar datos
        run: |
          git config user.name "gundam-bot"; git config user.email "bot@users.noreply.github.com"
          git add data; git diff --staged --quiet || (git commit -m "datos $(date -u +%F\ %H:%M)" && git push)
